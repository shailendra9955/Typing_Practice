<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>TypeSpace — Typing Practice</title>

  <style>
    :root {
      --bg: #edf1f7;
      --paper: #ffffff;
      --ink: #1c2430;
      --muted: #707a89;
      --primary: #1769e0;
      --primary-dark: #0d55bc;
      --danger: #d83a4d;
      --border: #dbe2ec;
      --shadow: 0 12px 34px rgba(24, 42, 72, 0.13);
      --line-height: 1.9rem;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 960px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.2px;
      font-weight: 700;
    }

    .timer-box {
      min-width: 88px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--primary);
      text-align: center;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .typing-paper {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background-color: var(--paper);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .typing-paper::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(
        to bottom,
        transparent calc(var(--line-height) - 1px),
        #e6ebf3 calc(var(--line-height) - 1px)
      );
      background-size: 100% var(--line-height);
      background-position: 0 18px;
      opacity: 0.88;
    }

    #typingArea {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      min-height: calc(100dvh - 190px);
      resize: none;
      padding: 18px 18px 24px;
      border: 0;
      outline: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      font-size: 1.05rem;
      line-height: var(--line-height);
      letter-spacing: 0.1px;
      caret-color: var(--primary);
    }

    #typingArea::placeholder {
      color: #99a4b2;
      opacity: 1;
    }

    .bottom-actions {
	display: flex;
	gap: 10px;
	}

	.finish-button,
	.restart-button {
		flex: 1;
		min-height: 52px;
		padding: 12px 14px;
		border-radius: 12px;
		font-size: 1rem;
		font-weight: 700;
		}

	.finish-button {
		background: var(--primary);
		color: #fff;
		box-shadow: 0 7px 16px rgba(23, 105, 224, 0.25);
		}

	.restart-button {
		border: 1px solid var(--border);
		background: #ffffff;
		color: #3e4b5e;
		}

	.finish-button:active,
	.restart-button:active,
	.primary-button:active {
		transform: scale(0.98);
		}

	.finish-button:hover,
	.primary-button:hover {
		background: var(--primary-dark);
		}

	.restart-button:hover {
		background: #f4f7fb;
		}

    /* Result Popup */
    .modal-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(16, 28, 47, 0.62);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .result-card {
      width: min(100%, 620px);
      max-height: min(86dvh, 760px);
      overflow-y: auto;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      animation: popup 180ms ease-out;
    }

    @keyframes popup {
      from {
        transform: translateY(14px) scale(0.98);
        opacity: 0;
      }

      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .result-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .icon-close {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #eef2f7;
      color: #4d5869;
      font-size: 1.4rem;
      line-height: 1;
    }

    .result-content {
      padding: 18px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8faff;
    }

    .stat-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .analysis-section {
      margin-top: 18px;
    }

    .analysis-section h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .analysis-note {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.87rem;
      line-height: 1.45;
    }

    .checking-message,
    .no-errors {
      padding: 12px;
      border-radius: 10px;
      background: #edf7f0;
      color: #277744;
      font-size: 0.92rem;
    }

    .checking-message {
      background: #f0f4fa;
      color: #526175;
    }

    .error-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .error-item {
      padding: 11px 12px;
      border-left: 4px solid var(--danger);
      border-radius: 8px;
      background: #fff3f4;
      color: #4a252b;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .error-item strong {
      color: var(--danger);
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 18px 18px;
    }

    .primary-button,
    .secondary-button {
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
    }

    .primary-button {
      background: var(--primary);
      color: white;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: #fff;
      color: #3e4b5e;
    }

    .secondary-button:hover {
      background: #f4f7fb;
    }

    @media (max-width: 480px) {
      :root {
        --line-height: 1.8rem;
      }

      .app {
        padding: 10px;
        gap: 10px;
      }

      .typing-paper {
        border-radius: 12px;
      }

      #typingArea {
        min-height: calc(100dvh - 166px);
        padding: 14px 14px 20px;
        font-size: 1rem;
      }

      .result-card {
        max-height: 90dvh;
        border-radius: 16px;
      }

      .result-content {
        padding: 14px;
      }

      .result-actions {
        padding: 0 14px 14px;
      }
	  
	  .bottom-actions {
			gap: 8px;
			}

	.finish-button,
	.restart-button {
		min-height: 50px;
		padding: 10px 8px;
		font-size: 0.9rem;
		}
    }
	
	.typing-error {
		display: none;
		margin: -4px 2px 0;
		color: #c22639;
		font-size: 0.9rem;
		font-weight: 600;
	}
		
	.typing-error.show {
		display: block;
	}
		
	.typing-paper.has-error {
		border-color: #d83a4d;
		box-shadow: 0 0 0 3px rgba(216, 58, 77, 0.15);
	}
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <h1 class="brand">TypeSpace</h1>
      <div class="timer-box" id="timer" aria-live="polite">00:00</div>
    </header>

    <section class="typing-paper" aria-label="Typing practice paper">
      <textarea
        id="typingArea"
        aria-label="Typing area"
        placeholder="Start typing here..."
        spellcheck="true"
        autocomplete="off"
        autocapitalize="sentences"
      ></textarea>
    </section>
	<p id="typingError" class="typing-error" role="alert" aria-live="polite"></p>

    <div class="bottom-actions">
      <button class="finish-button" id="finishButton" type="button">
        Finish Typing
      </button>
	  <button class="restart-button" id="restartButton" type="button">
        Re-Start
      </button>
    </div>
  </main>

  <div
    class="modal-backdrop"
    id="resultModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="resultTitle"
  >
    <section class="result-card">
      <header class="result-header">
        <h2 id="resultTitle">Typing Result</h2>
        <button
          class="icon-close"
          id="modalCloseButton"
          type="button"
          aria-label="Close result"
        >
          ×
        </button>
      </header>

      <div class="result-content">
        <div class="stats-grid">
          <div class="stat">
            <span class="stat-label">Speed</span>
            <span class="stat-value" id="wpmResult">0 WPM</span>
          </div>

          <div class="stat">
            <span class="stat-label">Time Taken</span>
            <span class="stat-value" id="timeResult">00:00</span>
          </div>

          <div class="stat">
            <span class="stat-label">Total Words</span>
            <span class="stat-value" id="wordsResult">0</span>
          </div>

          <div class="stat">
            <span class="stat-label">Characters</span>
            <span class="stat-value" id="charactersResult">0</span>
          </div>
        </div>

        <section class="analysis-section">
          <h3>English Writing Check</h3>
          <p class="analysis-note">
            Spelling and grammar suggestions are checked after you finish typing.
          </p>
          <div id="analysisResult" class="checking-message">
            Preparing analysis...
          </div>
        </section>
      </div>

      <footer class="result-actions">
        <button class="primary-button" id="tryAgainButton" type="button">
          Try Again
        </button>
        <button class="secondary-button" id="closePracticeButton" type="button">
          Close
        </button>
      </footer>
    </section>
  </div>

  <script>
    const typingArea = document.getElementById("typingArea");
    const finishButton = document.getElementById("finishButton");
	const restartButton = document.getElementById("restartButton");
	const typingError = document.getElementById("typingError");
	const typingPaper = document.querySelector(".typing-paper");
    const timerElement = document.getElementById("timer");
    const resultModal = document.getElementById("resultModal");
    const modalCloseButton = document.getElementById("modalCloseButton");
    const tryAgainButton = document.getElementById("tryAgainButton");
    const closePracticeButton = document.getElementById("closePracticeButton");

    const wpmResult = document.getElementById("wpmResult");
    const timeResult = document.getElementById("timeResult");
    const wordsResult = document.getElementById("wordsResult");
    const charactersResult = document.getElementById("charactersResult");
    const analysisResult = document.getElementById("analysisResult");

    let startedAt = null;
    let elapsedSeconds = 0;
    let timerInterval = null;
    let practiceFinished = false;

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function updateTimer() {
      if (!startedAt) return;

      elapsedSeconds = Math.max(
        1,
        Math.floor((Date.now() - startedAt) / 1000)
      );

      timerElement.textContent = formatTime(elapsedSeconds);
    }

    function startTimer() {
      if (startedAt || practiceFinished) return;

      startedAt = Date.now();
      updateTimer();

      timerInterval = setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function countWords(text) {
      const cleanText = text.trim();

      if (!cleanText) return 0;

      return cleanText.split(/\s+/).filter(Boolean).length;
    }
	

    function escapeHTML(value) {
      const safeValue = String(value);

      return safeValue
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function checkGrammarAndSpelling(text) {
      if (!text.trim()) {
        analysisResult.innerHTML = `
          <div class="no-errors">
            No text was entered, so there is nothing to check.
          </div>
        `;
        return;
      }

      analysisResult.innerHTML = `
        <div class="checking-message">
          Checking spelling and grammar...
        </div>
      `;

      try {
        const response = await fetch(
          "https://api.languagetool.org/v2/check",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
              text: text,
              language: "en-US"
            })
          }
        );

        if (!response.ok) {
          throw new Error("Grammar service is unavailable.");
        }

        const data = await response.json();
        const issues = data.matches || [];

        if (issues.length === 0) {
          analysisResult.innerHTML = `
            <div class="no-errors">
              Great work — no spelling or grammar suggestions were found.
            </div>
          `;
          return;
        }

        const displayedIssues = issues.slice(0, 10);

        const issueItems = displayedIssues
          .map((issue) => {
            const originalText = text.substring(
              issue.offset,
              issue.offset + issue.length
            );

            const replacement =
              issue.replacements && issue.replacements.length > 0
                ? issue.replacements[0].value
                : "No replacement suggested";

            return `
              <li class="error-item">
                <strong>${escapeHTML(originalText || "Writing issue")}:</strong>
                ${escapeHTML(issue.message)}
                <br />
                Suggestion: ${escapeHTML(replacement)}
              </li>
            `;
          })
          .join("");

        const additionalText =
          issues.length > 10
            ? `<p class="analysis-note">Showing the first 10 of ${issues.length} suggestions.</p>`
            : "";

        analysisResult.innerHTML = `
          <ul class="error-list">
            ${issueItems}
          </ul>
          ${additionalText}
        `;
      } catch (error) {
        analysisResult.innerHTML = `
          <div class="checking-message">
            Your typing result is ready, but the spelling and grammar service could not be reached.
            Check your internet connection and try again.
          </div>
        `;
      }
    }
	
	function showTypingError(message) {
  typingError.textContent = message;
  typingError.classList.add("show");
  typingPaper.classList.add("has-error");
}

function clearTypingError() {
  typingError.textContent = "";
  typingError.classList.remove("show");
  typingPaper.classList.remove("has-error");
}

    function finishPractice() {
  if (practiceFinished) return;

  const typedText = typingArea.value;

  if (!typedText.trim()) {
    showTypingError("Please type some text before finishing your typing practice.");
    typingArea.focus();
    return;
  }

  clearTypingError();

  const totalWords = countWords(typedText);

      if (!startedAt) {
        elapsedSeconds = 0;
      } else {
        updateTimer();
      }

      stopTimer();
      practiceFinished = true;
      typingArea.disabled = true;

      const minutes = elapsedSeconds / 60;
      const wpm = minutes > 0 ? Math.round(totalWords / minutes) : 0;

      wpmResult.textContent = `${wpm} WPM`;
      timeResult.textContent = formatTime(elapsedSeconds);
      wordsResult.textContent = totalWords;
      charactersResult.textContent = typedText.length;

      resultModal.classList.add("show");
      checkGrammarAndSpelling(typedText);
    }
	
	function restartTyping() {
	stopTimer();

		startedAt = null;
		elapsedSeconds = 0;
		practiceFinished = false;
		
		typingArea.value = "";
		typingArea.disabled = false;
		timerElement.textContent = "00:00";
		
		clearTypingError();
		resultModal.classList.remove("show");
		
		setTimeout(() => {
			typingArea.focus();
		}, 100);
	}

    function resetPractice() {
      stopTimer();

      startedAt = null;
      elapsedSeconds = 0;
      practiceFinished = false;

      timerElement.textContent = "00:00";
      typingArea.value = "";
      typingArea.disabled = false;
      resultModal.classList.remove("show");

      setTimeout(() => typingArea.focus(), 100);
    }

    function closePractice() {
      resultModal.classList.remove("show");
      typingArea.disabled = false;
      practiceFinished = false;
      stopTimer();
    }

    typingArea.addEventListener("input", () => {
	clearTypingError();
	startTimer();
		});

    finishButton.addEventListener("click", finishPractice);
	
	restartButton.addEventListener("click", restartTyping);

    tryAgainButton.addEventListener("click", resetPractice);

    modalCloseButton.addEventListener("click", closePractice);

    closePracticeButton.addEventListener("click", closePractice);

    resultModal.addEventListener("click", (event) => {
      if (event.target === resultModal) {
        closePractice();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && resultModal.classList.contains("show")) {
        closePractice();
      }
    });
  </script>
</body>
</html>
